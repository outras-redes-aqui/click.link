<meta property="og:title" content="Fé da Nova Jerusalém">
<meta property="og:description" content="Ensinamentos de Jesus, orações e mensagens de fé.">
<meta property="og:image" content="icone.jpg">
<style>
  :root{
    --azul-claro:#dff0fb;
    --azul:#a9d4f0;
    --azul-escuro:#2f5f86;
    --amarelo-claro:#fff6cf;
    --dourado:#d9b44a;
    --texto:#2a3f55;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--texto);
    background:linear-gradient(160deg,var(--azul-claro) 0%,#eef7fd 45%,var(--amarelo-claro) 100%);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    padding:24px 16px 48px;
  }
  main{width:100%;max-width:440px;text-align:center}

  /* Foto do perfil no topo */
  .logo{
    display:block;
    width:180px;height:180px;margin:0 auto;
    border-radius:50%;
    object-fit:cover;
    background:#fff;
    box-shadow:0 10px 30px rgba(47,95,134,.3),0 0 0 8px rgba(255,246,207,.8),0 0 0 10px rgba(217,180,74,.55);
  }
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sub{margin-top:34px;font-size:1rem;line-height:1.5;color:#46627c}
  .versiculo{
    margin:22px auto 6px;padding:14px 16px;
    background:rgba(255,255,255,.65);
    border-left:4px solid var(--dourado);
    border-radius:10px;font-style:italic;font-size:.95rem;line-height:1.5;
  }
  .versiculo span{display:block;margin-top:4px;font-style:normal;font-weight:600;color:var(--azul-escuro);font-size:.85rem}

  /* Botões */
  .links{margin-top:26px;display:flex;flex-direction:column;gap:14px}
  .link{
    --cor:var(--dourado);
    display:flex;align-items:center;gap:14px;
    padding:12px 18px 12px 12px;border-radius:16px;text-decoration:none;
    background:#fff;color:var(--azul-escuro);font-weight:600;font-size:1.05rem;
    border:2px solid var(--azul);
    box-shadow:0 4px 14px rgba(47,95,134,.12);
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  }
  .link:hover,.link:focus-visible{
    transform:translateY(-3px);
    border-color:var(--cor);
    box-shadow:0 8px 20px rgba(47,95,134,.22);
    outline:none;
  }
  .kwai{--cor:#ff4906}
  .instagram{--cor:#d62976}
  .facebook{--cor:#1877f2}
